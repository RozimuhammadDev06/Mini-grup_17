# Development stack: docker compose -f docker-compose.dev.yml up --build
name: stroyopttorg-dev

x-django-env: &django-env
  DEBUG: "1"
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  ALLOWED_HOSTS: "*"
  DB_TYPE: psql
  POSTGRES_DB: ${POSTGRES_DB:-stroyopttorg}
  POSTGRES_USER: ${POSTGRES_USER:-stroyopttorg}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stroyopttorg}
      POSTGRES_USER: ${POSTGRES_USER:-stroyopttorg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed in development only, for psql/GUI access from the host.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stroyopttorg}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "1"
    volumes:
      # Bind mount gives autoreload on save.
      - ./src:/app
      - dev_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "0"
    volumes:
      - ./src:/app
      - dev_media:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "0"
    volumes:
      - ./src:/app
    depends_on:
      redis: {condition: service_healthy}

volumes:
  postgres_data:
  dev_media:
